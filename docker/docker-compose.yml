version: '3.8'

services:
  postgres96:
    image: postgres:9.6-alpine
    environment:
      POSTGRES_USER: sqltraining
      POSTGRES_PASSWORD: training123
      POSTGRES_DB: sql_training_96
    ports:
      - "5432:5432"
    volumes:
      - pg96_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqltraining -d sql_training_96"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres13:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: sqltraining
      POSTGRES_PASSWORD: training123
      POSTGRES_DB: sql_training_13
    ports:
      - "5433:5432"
    volumes:
      - pg13_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqltraining -d sql_training_13"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg96_data:
  pg13_data: